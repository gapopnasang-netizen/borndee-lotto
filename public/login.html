<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>เข้าสู่ระบบ - หวยลาว VIP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-6 font-sans bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black overflow-hidden">
    <div class="max-w-md w-full bg-slate-900/90 border border-slate-800 p-8 rounded-3xl shadow-2xl space-y-6 animate-float relative">
        <div class="absolute -top-10 -right-10 w-32 h-32 bg-emerald-500/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-purple-500/20 rounded-full blur-3xl pointer-events-none"></div>

        <div class="text-center space-y-2 relative z-10">
            <div class="inline-block p-3.5 bg-emerald-500/10 border border-emerald-500/30 rounded-2xl text-emerald-400 text-3xl font-black mb-1 animate-pulse">
                🍀
            </div>
            <h1 class="text-xl font-bold text-white">เข้าสู่ระบบแพลตฟอร์ม</h1>
            <p class="text-xs text-slate-400">ระบบยืนยันตัวตนด้วยรหัสผ่านและสิทธิ์ผู้ใช้งาน</p>
        </div>

        <div class="space-y-4 relative z-10">
            <div>
                <label class="text-xs text-slate-400 font-medium">สิทธิ์การเข้าใช้งาน:</label>
                <select id="role-select" class="w-full bg-slate-950 border border-slate-800 p-3.5 rounded-2xl text-sm mt-1 focus:border-emerald-500 focus:outline-none transition">
                    <option value="member">🎯 เมมเบอร์ (สมาชิกผู้เล่น)</option>
                    <option value="agent">🛡️ เอเจนต์ (ผู้จัดการสายงาน)</option>
                    <option value="admin">👑 แอดมิน (ผู้ควบคุมระบบสูงสุด)</option>
                </select>
            </div>
            <div>
                <label class="text-xs text-slate-400 font-medium">ชื่อผู้ใช้งาน (Username):</label>
                <input type="text" id="username" placeholder="กรอกยูสเซอร์เนม" class="w-full bg-slate-950 border border-slate-800 p-3.5 rounded-2xl text-sm mt-1 focus:border-emerald-500 focus:outline-none transition">
            </div>
            <div>
                <label class="text-xs text-slate-400 font-medium">รหัสผ่าน (Password):</label>
                <input type="password" id="password" value="123456" placeholder="รหัสผ่าน" class="w-full bg-slate-950 border border-slate-800 p-3.5 rounded-2xl text-sm mt-1 focus:border-emerald-500 focus:outline-none transition">
            </div>
            <button onclick="handleLogin()" class="w-full bg-gradient-to-r from-emerald-400 to-teal-500 hover:from-emerald-300 hover:to-teal-400 text-slate-950 font-bold py-3.5 rounded-2xl shadow-lg shadow-emerald-500/25 transition">
                🚀 เข้าสู่ระบบ
            </button>
        </div>
    </div>

    <script>
        async function handleLogin() {
            const role = document.getElementById('role-select').value;
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if(!username || !password) return alert('กรุณากรอกข้อมูลให้ครบถ้วน');

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password, role })
            });
            const data = await res.json();

            if(data.success) {
                alert('เข้าสู่ระบบสำเร็จ!');
                if(data.role === 'member') window.location.href = '/';
                else if(data.role === 'agent') window.location.href = '/agent';
                else if(data.role === 'admin') window.location.href = '/admin';
            } else {
                alert(data.message);
            }
        }
    </script>
</body>
</html>
