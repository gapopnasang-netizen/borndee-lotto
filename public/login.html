<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>เข้าสู่ระบบ - LAO LOTTO (Borndee)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">
    <div class="max-w-md w-full bg-slate-800 border border-slate-700 p-8 rounded-3xl shadow-2xl space-y-6 animate-fade-in">
        <div class="text-center space-y-2">
            <div class="w-12 h-12 bg-emerald-500 text-slate-950 rounded-2xl mx-auto flex items-center justify-center font-black text-xl shadow-lg">🍀</div>
            <h1 class="text-base font-bold text-amber-400">เข้าสู่ระบบแพลตฟอร์ม</h1>
            <p class="text-xs text-slate-400">ระบบยืนยันตัวตนด้วยรหัสผ่านและสิทธิ์ผู้ใช้งาน</p>
        </div>

        <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4 text-xs">
            <div class="space-y-1">
                <label class="text-slate-400 font-bold block">ชื่อผู้ใช้งาน (Username):</label>
                <input type="text" id="username" required placeholder="กรอกชื่อผู้ใช้..." class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-xs text-amber-300 font-bold focus:outline-none focus:border-amber-500 transition">
            </div>

            <div class="space-y-1">
                <label class="text-slate-400 font-bold block">รหัสผ่าน (Password):</label>
                <input type="password" id="password" required placeholder="กรอกรหัสผ่าน..." class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-xs text-amber-300 font-bold focus:outline-none focus:border-amber-500 transition">
            </div>

            <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3.5 rounded-xl shadow-lg text-xs transition transform active:scale-95">
                🚀 เข้าสู่ระบบ
            </button>
        </form>
    </div>

    <script>
        async function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await res.json();
                if (data.success) {
                    window.location.href = data.redirectTo;
                } else {
                    // ป้องกันคำว่า undefined โดยการดึง message หรือ error สำรอง
                    alert(data.message || data.error || 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
                }
            } catch (err) {
                alert('เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์');
            }
        }
    </script>
</body>
</html>
